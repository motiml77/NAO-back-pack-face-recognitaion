name: Publish website

on:
  push:
    branches: [main, ccr-9057a387-k9n69g]
    paths: ["docs/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the build, so browsers load the new files at once (not after the 10 minute cache)
        run: |
          STAMP=$(git rev-parse --short HEAD)
          WHEN=$(date -u +"%d/%m/%Y %H:%M UTC")
          sed -i "s|__BUILD__|$STAMP|g; s|__BUILT__|$WHEN|g" docs/index.html docs/app.js
      - name: Publish docs/ to the gh-pages branch (GitHub Pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
