name: Remote Printer installer

on:
  push:
    branches: [main, ccr-9057a387-k9n69g]
    paths:
      - "remote-printer/**"
      - ".github/workflows/remote-printer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: remote-printer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1

      - name: Guard - the program must never be able to show a window
        run: python tools\check_silent.py

      - name: Test - replies and screenshots are encrypted to the device only
        run: python tools\test_reply_crypto.py

      - name: Test - HTTPS works with the bundled roots (the failure seen on a real PC)
        run: python tools\check_tls.py

      - name: Test - jobs wait for a login and print by themselves afterwards
        run: python tools\test_queue.py

      - name: Get SumatraPDF (bundled inside the installer)
        run: |
          $page = (Invoke-WebRequest "https://www.sumatrapdfreader.org/download-free-pdf-viewer" -UseBasicParsing).Content
          $m = [regex]::Match($page, 'dl/rel/([\d.]+)/SumatraPDF-[\d.]+-64\.zip')
          $url = if ($m.Success) { "https://www.sumatrapdfreader.org/" + $m.Value } else { "https://www.sumatrapdfreader.org/dl/rel/3.6.1/SumatraPDF-3.6.1-64.zip" }
          Write-Host "Downloading $url"
          Invoke-WebRequest $url -OutFile sumatra.zip
          Expand-Archive sumatra.zip -DestinationPath sumatra
          $exe = Get-ChildItem sumatra -Filter *.exe -Recurse | Select-Object -First 1
          Copy-Item $exe.FullName installer\SumatraPDF.exe

      - name: Build program
        run: pyinstaller --noconfirm --noconsole --onedir --name RemotePrinter --collect-submodules cryptography --collect-data certifi --hidden-import win32timezone remote_printer.py

      - name: Self-test of the built program
        run: |
          Copy-Item installer\SumatraPDF.exe dist\RemotePrinter\
          $p = Start-Process dist\RemotePrinter\RemotePrinter.exe -ArgumentList "--selftest" -Wait -PassThru
          $data = "$env:ProgramData\RemotePrinter"
          Get-Content "$data\selftest.txt" -ErrorAction SilentlyContinue
          Get-Content "$data\crash.txt" -ErrorAction SilentlyContinue
          $code = $p.ExitCode
          Remove-Item dist\RemotePrinter\SumatraPDF.exe -ErrorAction SilentlyContinue
          Remove-Item $data -Recurse -Force -ErrorAction SilentlyContinue
          if ($code -ne 0) { exit 1 }

      - name: Build installer
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=3.7.${{ github.run_number }} installer\RemotePrinter.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item dist\RemotePrinter-Setup.exe | Format-List Name, Length

      - name: Test - install like a user, run as SYSTEM, real printing, clean uninstall
        run: |
          $data = "$env:ProgramData\RemotePrinter"
          $app = "$env:ProgramFiles\RemotePrinter"
          function Show-Log { Get-Content "$data\remote_printer.log" -ErrorAction SilentlyContinue | Select-Object -Last 80 }
          function Get-RpProcess { Get-CimInstance Win32_Process -Filter "Name='RemotePrinter.exe'" | Select-Object -First 1 }
          function Get-RpOwner { $o = Invoke-CimMethod -InputObject (Get-RpProcess) -MethodName GetOwner; "$($o.Domain)\$($o.User)" }
          function Show-PrintDiagnostics {
            Write-Host "=== PRINT DIAGNOSTICS ==="
            Show-Log
            Get-Printer -Name "Pantum CI Test" | Format-List Name, DriverName, PortName, PrinterStatus
            Get-PrintJob -PrinterName "Pantum CI Test" | Format-List Id, DocumentName, JobStatus, UserName
            $pdf = (Resolve-Path tools\test_page.pdf).Path
            Get-PrintJob -PrinterName "Pantum CI Test" | Remove-PrintJob -ErrorAction SilentlyContinue
            Remove-Item C:\ci\printed.pdf -ErrorAction SilentlyContinue
            Write-Host "--- the same print, as the runner's own user"
            & "$app\SumatraPDF.exe" -print-to "Pantum CI Test" -silent $pdf
            Start-Sleep 20
            Get-PrintJob -PrinterName "Pantum CI Test" | Format-List Id, DocumentName, JobStatus, UserName
            Write-Host ("output file exists: " + (Test-Path C:\ci\printed.pdf))
            Get-PrintJob -PrinterName "Pantum CI Test" | Remove-PrintJob -ErrorAction SilentlyContinue
            Remove-Item C:\ci\printed.pdf -ErrorAction SilentlyContinue
            Write-Host "--- the same print, as SYSTEM through a one-off task"
            $act = New-ScheduledTaskAction -Execute "$app\SumatraPDF.exe" -Argument "-print-to `"Pantum CI Test`" -silent `"$pdf`""
            Register-ScheduledTask -TaskName RpDiag -Action $act -User SYSTEM -RunLevel Highest -Force | Out-Null
            Start-ScheduledTask -TaskName RpDiag
            Start-Sleep 20
            Get-PrintJob -PrinterName "Pantum CI Test" | Format-List Id, DocumentName, JobStatus, UserName
            Write-Host ("output file exists: " + (Test-Path C:\ci\printed.pdf))
            Unregister-ScheduledTask -TaskName RpDiag -Confirm:$false
            Get-PrintJob -PrinterName "Pantum CI Test" | Remove-PrintJob -ErrorAction SilentlyContinue
          }
          function Wait-RpProcess { for ($i = 0; $i -lt 40 -and -not (Get-RpProcess); $i++) { Start-Sleep 1 }; if (-not (Get-RpProcess)) { Show-Log; throw "the program is not running" } }

          # 0. a throw-away test channel in the settings file BEFORE installing (this machine must never
          #    answer on the real channel), and a test printer whose output goes to a file
          Remove-Item $data -Recurse -Force -ErrorAction SilentlyContinue
          $pw = "ci-" + [guid]::NewGuid().ToString("N").Substring(0, 12)
          $lines = python tools\test_channel.py $pw
          $topic = ($lines | Select-String "^topic = ").ToString().Split("= ")[-1]
          $key = ($lines | Select-String "^key = ").ToString().Split("= ")[-1]
          New-Item -ItemType Directory -Force $data | Out-Null
          Set-Content "$data\config.ini" (@("[general]") + $lines) -Encoding utf8
          New-Item -ItemType Directory -Force C:\ci | Out-Null
          Add-PrinterPort -Name "C:\ci\printed.pdf"
          Add-Printer -Name "Pantum CI Test" -DriverName "Microsoft Print To PDF" -PortName "C:\ci\printed.pdf"

          # 1. install exactly like a user would get it: no parameters, no questions
          $p = Start-Process dist\RemotePrinter-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=install.log" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(300000)) { $p.Kill(); Get-Content install.log -Tail 40; throw "the installer did not finish" }
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 40; throw "installer failed with code $($p.ExitCode)" }
          foreach ($f in "RemotePrinter.exe", "SumatraPDF.exe") { if (-not (Test-Path "$app\$f")) { throw "$f not installed" } }
          Write-Host "--- setup log"; Show-Log

          # 2. the startup task: at boot, as SYSTEM, highest privileges
          $xml = (schtasks /Query /TN RemotePrinter /XML | Out-String)
          foreach ($need in "BootTrigger", "HighestAvailable") { if ($xml -notmatch $need) { Write-Host $xml; throw "startup task lacks $need" } }
          if ($xml -notmatch "S-1-5-18|SYSTEM") { Write-Host $xml; throw "startup task does not run as SYSTEM" }
          Write-Host ("Task triggers: " + (([regex]::Matches($xml, "<(Boot|Logon|Time)Trigger") | ForEach-Object { $_.Groups[1].Value }) -join ", "))

          # 3. it runs right after the installation (no restart), as SYSTEM
          Wait-RpProcess
          $owner = Get-RpOwner
          Write-Host "Running as: $owner"
          if ($owner -notmatch "SYSTEM") { throw "the program is not running as SYSTEM ($owner)" }
          Start-Sleep 5

          # 4. ping: it answers, and picked the Pantum printer by itself
          $reply = python tools\send_test.py --password $pw --topic $topic --key $key ping
          Write-Host $reply
          if ($LASTEXITCODE -ne 0) { Show-Log; throw "no answer to ping" }
          if ("$reply" -notmatch "Pantum CI Test") { throw "Pantum printer was not detected automatically" }

          # 5. a wrong password must be ignored
          python tools\send_test.py --password "wrong-password" --topic $topic --key $key --timeout 20 ping
          if ($LASTEXITCODE -eq 0) { throw "a message signed with a wrong password was accepted!" }

          # 6. REAL silent print through the Windows spooler, as SYSTEM, confirmed by the program
          python tools\send_test.py --password $pw --topic $topic --key $key print tools\test_page.pdf
          if ($LASTEXITCODE -ne 0) { Show-PrintDiagnostics; throw "real print failed" }
          Start-Sleep 2
          $out = Get-Item C:\ci\printed.pdf -ErrorAction SilentlyContinue
          if (-not $out -or $out.Length -lt 1000) { Show-Log; throw "printer output missing" }
          Write-Host "Printed output: $($out.Length) bytes"

          # 6b. the exact PDF the website produces, under a Hebrew file name
          Copy-Item tools\site_sample.pdf "C:\ci\דף מהאתר - בדיקה.pdf"
          Remove-Item C:\ci\printed.pdf
          python tools\send_test.py --password $pw --topic $topic --key $key print "C:\ci\דף מהאתר - בדיקה.pdf"
          if ($LASTEXITCODE -ne 0) { Show-Log; throw "printing the website PDF failed" }
          Start-Sleep 2
          $out = Get-Item C:\ci\printed.pdf -ErrorAction SilentlyContinue
          if (-not $out -or $out.Length -lt 1000) { throw "website PDF produced no printer output" }
          Write-Host "Website PDF printed: $($out.Length) bytes"

          # 6c. printer problem: pause the printer -> the program must report it
          Get-CimInstance Win32_Printer -Filter "Name='Pantum CI Test'" | Invoke-CimMethod -MethodName Pause | Out-Null
          python tools\send_test.py --password $pw --topic $topic --key $key --expect-error --require-shot print tools\test_page.pdf
          if ($LASTEXITCODE -ne 0) { Show-Log; throw "a paused printer was not reported as a problem, with an encrypted screenshot" }
          Get-CimInstance Win32_Printer -Filter "Name='Pantum CI Test'" | Invoke-CimMethod -MethodName Resume | Out-Null

          # 6d. screenshots (need a logged-on desktop: informational on the build machine)
          python tools\send_test.py --password $pw --topic $topic --key $key --timeout 45 shot
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::no screenshot from the SYSTEM program (the build machine may have no logged-on desktop)" }
          & "$app\RemotePrinter.exe" --screenshot C:\ci\direct.jpg
          Start-Sleep 3
          if (Test-Path C:\ci\direct.jpg) { Write-Host "Direct screenshot: $((Get-Item C:\ci\direct.jpg).Length) bytes" } else { Write-Host "::warning::direct screenshot not available on the build machine" }

          # 6d2. an old website page (no device key) still gets answers, but never a screenshot
          python tools\send_test.py --password $pw --topic $topic --key $key --legacy ping
          if ($LASTEXITCODE -ne 0) { throw "an old-style ping got no answer" }

          # 6e. the Word helper without Word: must fail quietly with a message (exit code 3)
          $h = Start-Process "$app\RemotePrinter.exe" -ArgumentList "--word-to-pdf", "C:\ci\none.docx", "C:\ci\none.pdf", "C:\ci\none.err" -PassThru
          $null = $h.Handle
          if (-not $h.WaitForExit(60000)) { $h.Kill(); throw "the Word helper hung" }
          Write-Host "Word helper exit code: $($h.ExitCode); message: $(Get-Content C:\ci\none.err -ErrorAction SilentlyContinue)"
          if ($h.ExitCode -ne 3) { throw "the Word helper should exit with 3 when Word is missing" }

          # 7. unsupported file -> a clean error reply
          python tools\send_test.py --password $pw --topic $topic --key $key --expect-error print ..\docs\fonts\StamAshkenazCLM-LICENSE.txt
          if ($LASTEXITCODE -ne 0) { throw "expected an error reply for an unsupported file" }

          # 8. the task brings the program back (this is what the boot / 5-minute triggers do)
          Stop-Process -Name RemotePrinter -Force
          Start-Sleep 2
          if (Get-RpProcess) { throw "could not stop the program for the restart test" }
          schtasks /Run /TN RemotePrinter | Out-Null
          Wait-RpProcess
          $owner = Get-RpOwner
          Write-Host "After restart through the task, running as: $owner"
          if ($owner -notmatch "SYSTEM") { throw "restarted copy is not SYSTEM" }
          Start-Sleep 5
          python tools\send_test.py --password $pw --topic $topic --key $key ping
          if ($LASTEXITCODE -ne 0) { Show-Log; throw "no answer after restart" }
          Write-Host "--- final log"; Show-Log

          # 9. clean uninstall: program, startup task and data are removed
          $u = Get-ChildItem $app -Filter "unins*.exe" | Select-Object -First 1
          $p = Start-Process $u.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru
          $null = $p.Handle
          $null = $p.WaitForExit(120000)
          for ($i = 0; $i -lt 90 -and (Test-Path "$app\RemotePrinter.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$app\RemotePrinter.exe") { throw "program files still there after uninstall" }
          schtasks /Query /TN RemotePrinter 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "startup task still there after uninstall" }
          if (Get-RpProcess) { throw "the program is still running after uninstall" }
          Write-Host "Uninstall is clean"
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: RemotePrinter-Setup
          path: remote-printer/dist/RemotePrinter-Setup.exe

      - name: Publish as a GitHub release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: remote-printer-3.7.${{ github.run_number }}
          name: הדפסה מרחוק 3.7.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: remote-printer/dist/RemotePrinter-Setup.exe
          body: |
            תוכנת ההתקנה למחשב שמחובר למדפסת (Windows 10 / 11). התקנה אוטומטית לגמרי, הכול בפנים, ועולה לבד אחרי כל הפעלה של המחשב.
            אתר ההדפסה: https://motiml77.github.io/NAO-back-pack-face-recognitaion/

  # Runs on its own machine AFTER the build job (the release is already published by then), so an exploratory
  # test can never hold back a release: the installed program must keep answering and printing while the
  # Windows screen is LOCKED.
  locked-screen:
    needs: build
    if: ${{ always() }}
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: remote-printer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: RemotePrinter-Setup
          path: remote-printer/dist

      - name: Test - install, then lock the screen, then ping and print
        run: |
          $data = "$env:ProgramData\RemotePrinter"
          function Show-Log { Get-Content "$data\remote_printer.log" -ErrorAction SilentlyContinue | Select-Object -Last 60 }
          $pw = "ci-" + [guid]::NewGuid().ToString("N").Substring(0, 12)
          $lines = python tools\test_channel.py $pw
          $topic = ($lines | Select-String "^topic = ").ToString().Split("= ")[-1]
          $key = ($lines | Select-String "^key = ").ToString().Split("= ")[-1]
          Remove-Item $data -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $data | Out-Null
          Set-Content "$data\config.ini" (@("[general]") + $lines) -Encoding utf8
          New-Item -ItemType Directory -Force C:\ci | Out-Null
          Add-PrinterPort -Name "C:\ci\printed.pdf"
          Add-Printer -Name "Pantum CI Test" -DriverName "Microsoft Print To PDF" -PortName "C:\ci\printed.pdf"
          $p = Start-Process dist\RemotePrinter-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "the installer did not finish" }
          Start-Sleep 12
          Write-Host "--- sessions before locking"; query session
          python tools\send_test.py --password $pw --topic $topic --key $key ping
          if ($LASTEXITCODE -ne 0) { Show-Log; throw "no answer before locking (the test itself is broken)" }

          Add-Type -Namespace RpTest -Name Win -MemberDefinition '[System.Runtime.InteropServices.DllImport("user32.dll")] public static extern bool LockWorkStation();'
          $locked = $false
          if ([RpTest.Win]::LockWorkStation()) {
            for ($i = 0; $i -lt 20 -and -not $locked; $i++) { Start-Sleep 1; $locked = [bool](Get-Process LogonUI -ErrorAction SilentlyContinue) }
          }
          Write-Host "Workstation locked: $locked"
          Write-Host "--- sessions after locking"; query session
          if (-not $locked) { Write-Host "::warning::could not lock the build machine's screen - the locked-screen case was NOT verified"; exit 0 }

          python tools\send_test.py --password $pw --topic $topic --key $key --timeout 60 ping
          if ($LASTEXITCODE -ne 0) { Show-Log; throw "no answer while the screen is locked" }
          Remove-Item C:\ci\printed.pdf -ErrorAction SilentlyContinue
          python tools\send_test.py --password $pw --topic $topic --key $key --timeout 90 print tools\test_page.pdf
          $rc = $LASTEXITCODE
          Show-Log
          if ($rc -ne 0) { throw "printing failed while the screen is locked" }
          Start-Sleep 2
          $out = Get-Item C:\ci\printed.pdf -ErrorAction SilentlyContinue
          if (-not $out -or $out.Length -lt 1000) { throw "no printer output while the screen is locked" }
          Write-Host "Printed while locked: $($out.Length) bytes"
          python tools\send_test.py --password $pw --topic $topic --key $key --timeout 45 shot
          Write-Host "(screenshot while locked: exit code $LASTEXITCODE - a locked screen cannot be captured, the program must answer with a reason)"
