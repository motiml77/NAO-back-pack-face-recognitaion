; ============================================================
;  הגדרות - Remote Printer
;  העתיקו את הקובץ הזה לשם config.ini ומלאו את הפרטים.
;  שורה שמתחילה ב-; היא הערה.
; ============================================================

[general]
; שם המדפסת בדיוק כפי שהוא מופיע ב-Windows (הגדרות > מדפסות).
; להשאיר ריק = מדפסת ברירת המחדל.
printer_name =

; לשמור עותק של כל קובץ שהתקבל בתיקייה received?  yes / no
keep_files = yes

; גודל קובץ מקסימלי ב-MB (בטלגרם המגבלה היא 20)
max_file_mb = 20

; מצב בדיקה: yes = לא מדפיס באמת, רק כותב ללוג
dry_run = no

; נתיב ל-SumatraPDF.exe (רק ב-Windows, להדפסת PDF בשקט).
; להשאיר ריק = חיפוש אוטומטי (גם בתיקייה של התוכנה)
sumatra_path =

; נתיב ל-soffice של LibreOffice (נחוץ רק אם אין Microsoft Word). ריק = חיפוש אוטומטי
libreoffice_path =


[telegram]
; קבלת קבצים דרך בוט טלגרם (מומלץ)
enabled = yes

; הטוקן שמקבלים מ-@BotFather
bot_token =

; מספרי המשתמש (ID) שמורשים להדפיס, מופרדים בפסיקים. למשל: 123456789, 987654321
; כדי לדעת את המספר: הריצו את התוכנה ושלחו לבוט /start, והוא יענה עם המספר.
allowed_user_ids =


[email]
; קבלת קבצים כקובץ מצורף במייל (אופציונלי)
enabled = no

imap_server = imap.gmail.com
imap_port = 993

; כתובת המייל שהתוכנה בודקת (מומלץ ליצור תיבה נפרדת למדפסת)
username =

; ב-Gmail: "סיסמת אפליקציה" (App Password), לא הסיסמה הרגילה
password =

; כתובות שמורשות לשלוח להדפסה, מופרדות בפסיקים
allowed_senders =

; מילת סוד שחייבת להופיע בנושא המייל (מומלץ מאוד, כי קל לזייף כתובת שולח)
subject_secret =

; כל כמה שניות לבדוק אם הגיע מייל חדש
check_every_seconds = 30

folder = INBOX
